    <script>
        // ============================================
        // iOS Safari Compatibility Layer (v3.0)
        // - Private Browsing storage fallback
        // - Canvas fingerprint fallback
        // ============================================

        // iOS Viewport Height Fix
        function setMobileViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setMobileViewportHeight);
        window.addEventListener('orientationchange', setMobileViewportHeight);
        setMobileViewportHeight();

        // Storage Availability Test (iOS Private Browsing fails)
        function isStorageAvailable(type) {
            try {
                const storage = window[type];
                const test = '__storage_test__';
                storage.setItem(test, test);
                storage.removeItem(test);
                return true;
            } catch (e) {
                return false;
            }
        }

        // Memory fallback for Private Browsing mode
        const memorySessionStorage = {};
        const memoryLocalStorage = {};

        // Storage wrapper with fallback
        const safeSessionStorage = {
            getItem: (key) => isStorageAvailable('sessionStorage')
                ? sessionStorage.getItem(key)
                : (memorySessionStorage[key] || null),
            setItem: (key, value) => isStorageAvailable('sessionStorage')
                ? sessionStorage.setItem(key, value)
                : (memorySessionStorage[key] = value),
            removeItem: (key) => isStorageAvailable('sessionStorage')
                ? sessionStorage.removeItem(key)
                : delete memorySessionStorage[key]
        };

        const safeLocalStorage = {
            getItem: (key) => isStorageAvailable('localStorage')
                ? localStorage.getItem(key)
                : (memoryLocalStorage[key] || null),
            setItem: (key, value) => isStorageAvailable('localStorage')
                ? localStorage.setItem(key, value)
                : (memoryLocalStorage[key] = value),
            removeItem: (key) => isStorageAvailable('localStorage')
                ? localStorage.removeItem(key)
                : delete memoryLocalStorage[key]
        };

        // ==================== 보안: 세션 검증 (Enhanced v2.0 + iOS Compatible) ====================
        (function() {
            const SECURITY_CONFIG = {
                SESSION_KEY: 'qip_auth_session_v2',
                SESSION_KEY_LEGACY: 'qip_auth_session',
                SESSION_TIMEOUT: 30 * 60 * 1000 // 30분
            };

            // 브라우저 핑거프린트 생성 (iOS-safe)
            function getBrowserFingerprint() {
                // Basic fingerprint (always works)
                const basicFP = btoa(
                    navigator.userAgent +
                    screen.width + 'x' + screen.height +
                    navigator.language +
                    new Date().getTimezoneOffset()
                );

                // Canvas fingerprint (may fail on some iOS versions)
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        ctx.textBaseline = 'top';
                        ctx.font = '14px Arial';
                        ctx.fillText('fp', 2, 2);
                        return basicFP + canvas.toDataURL().slice(-30);
                    }
                } catch (e) {
                    console.warn('Canvas fingerprint unavailable');
                }

                return basicFP;
            }

            function validateSession() {
                // 새 세션 키 확인 (v2) - uses safe storage wrapper
                let session = safeSessionStorage.getItem(SECURITY_CONFIG.SESSION_KEY);

                // 레거시 세션 확인 (이전 버전 호환성)
                if (!session) {
                    session = safeSessionStorage.getItem(SECURITY_CONFIG.SESSION_KEY_LEGACY);
                    if (session) {
                        // 레거시 세션은 핑거프린트 검증 없이 통과 후 새 세션으로 마이그레이션
                        try {
                            const legacyData = JSON.parse(session);
                            if (legacyData.authenticated && Date.now() - legacyData.loginTime < SECURITY_CONFIG.SESSION_TIMEOUT) {
                                // 마이그레이션 성공 - 새 형식으로 저장
                                legacyData.fingerprint = getBrowserFingerprint();
                                legacyData.nonce = Date.now().toString(16);
                                safeSessionStorage.setItem(SECURITY_CONFIG.SESSION_KEY, JSON.stringify(legacyData));
                                safeSessionStorage.removeItem(SECURITY_CONFIG.SESSION_KEY_LEGACY);
                                return true;
                            }
                        } catch (e) {
                            // 파싱 실패
                        }
                    }
                }

                if (!session) {
                    window.location.href = 'auth.html';
                    return false;
                }

                try {
                    const sessionData = JSON.parse(session);
                    const now = Date.now();

                    // 필수 필드 확인
                    if (!sessionData.authenticated || !sessionData.loginTime) {
                        throw new Error('Invalid session data');
                    }

                    // 세션 타임아웃 확인
                    if (now - sessionData.loginTime >= SECURITY_CONFIG.SESSION_TIMEOUT) {
                        safeSessionStorage.removeItem(SECURITY_CONFIG.SESSION_KEY);
                        safeSessionStorage.removeItem(SECURITY_CONFIG.SESSION_KEY_LEGACY);
                        alert('🔒 Session expired. Please login again.\n세션이 만료되었습니다. 다시 로그인하세요.');
                        window.location.href = 'auth.html';
                        return false;
                    }

                    // 핑거프린트 검증 (있는 경우만)
                    if (sessionData.fingerprint) {
                        const currentFP = getBrowserFingerprint();
                        if (sessionData.fingerprint !== currentFP) {
                            safeSessionStorage.removeItem(SECURITY_CONFIG.SESSION_KEY);
                            alert('🔒 Session invalid. Browser mismatch detected.\n세션이 유효하지 않습니다. 브라우저 불일치가 감지되었습니다.');
                            window.location.href = 'auth.html';
                            return false;
                        }
                    }

                    return true;
                } catch (e) {
                    safeSessionStorage.removeItem(SECURITY_CONFIG.SESSION_KEY);
                    safeSessionStorage.removeItem(SECURITY_CONFIG.SESSION_KEY_LEGACY);
                    window.location.href = 'auth.html';
                    return false;
                }
            }

            // 페이지 로드 시 세션 검증
            if (!validateSession()) {
                return;
            }

            // 주기적 세션 검증 (1분마다)
            setInterval(validateSession, 60000);

            // 우클릭 방지
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('keydown', function(e) {

                    e.preventDefault();
                }
                if (e.key === 'F12') {
                    e.preventDefault();
                }
            });

            // 복사 방지 (선택적)

                console.warn('⚠️ 데이터 복사가 감지되었습니다. 기밀 정보 유출에 주의하세요.');
            });

            // 개발자 도구 경고
            const devtoolsWarning = () => {
                console.clear();
                console.log('%c⛔ SECURITY WARNING', 'font-size: 40px; color: red; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);');
                console.log('%cThis dashboard contains confidential employee information.', 'font-size: 16px; color: orange;');
                console.log('%c이 대시보드는 기밀 직원 정보를 포함하고 있습니다.', 'font-size: 16px; color: orange;');
                console.log('%cUnauthorized access or data extraction is prohibited and monitored.', 'font-size: 14px; color: red;');
                console.log('%c무단 접근 또는 데이터 추출은 금지되며 모니터링됩니다.', 'font-size: 14px; color: red;');
            };

            devtoolsWarning();
            setInterval(devtoolsWarning, 3000);
        })();
        // ==================== 보안 코드 종료 ====================

        // 다국어 번역 데이터
        const translations = {

        function switchLanguage(lang) {
            // localStorage에 저장 (uses safe storage wrapper for iOS Private Browsing)
            safeLocalStorage.setItem('preferredLanguage', lang);

            // HTML lang 속성 변경
            document.documentElement.lang = lang;

            // 모든 번역 요소 업데이트
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });

            // 월 카드의 월 이름 업데이트 (data-i18n이 없는 경우만)
            document.querySelectorAll('.month-card').forEach(card => {
                const monthNameElement = card.querySelector('.month-name');
                // data-i18n 속성이 있으면 이미 Lines 434-439에서 처리되었으므로 skip
                if (monthNameElement && !monthNameElement.hasAttribute('data-i18n')) {
                    const month = parseInt(card.getAttribute('data-month'));
                    if (translations[lang] && translations[lang]['months']) {
                        monthNameElement.textContent = translations[lang]['months'][month];
                    }
                }
            });

            // 페이지 타이틀 업데이트
            const titleElement = document.querySelector('title[data-i18n]');
            if (titleElement && translations[lang]) {
                document.title = translations[lang]['page-title'];
            }

            // 언어별 요소 표시/숨김 (data-lang-show 속성)
            document.querySelectorAll('[data-lang-show]').forEach(element => {
                const showLang = element.getAttribute('data-lang-show');
                if (showLang === lang) {
                    element.style.display = ''; // 표시
                } else {
                    element.style.display = 'none'; // 숨김
                }
            });

            // 활성 버튼 스타일 변경
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.lang-btn[data-lang="${lang}"]`).classList.add('active');

            // 진동 피드백
            if ('vibrate' in navigator) {
                navigator.vibrate(30);
            }
        }

        // 페이지 로드 시 저장된 언어 적용 (uses safe storage wrapper for iOS)
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = safeLocalStorage.getItem('preferredLanguage') || 'ko';
            switchLanguage(savedLang);
        });

        // 카드 클릭 애니메이션
        document.querySelectorAll('.month-card').forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    window.location.href = this.href;
                }, 200);
            });
        });

        // 페이지 로드시 현재 월 하이라이트
        const currentMonth = new Date().getMonth() + 1;
        const currentYear = new Date().getFullYear();
        document.querySelectorAll('.month-card').forEach(card => {
            const text = card.querySelector('.month-year').textContent;
            if (text.includes(`${currentYear}년 ${currentMonth}월`)) {
                card.style.border = '3px solid #ef4444';
            }
        });

        // 수동 업데이트 트리거 함수 (uses safe storage wrapper for iOS)
        function triggerManualUpdate() {
            const lang = safeLocalStorage.getItem('preferredLanguage') || 'ko';
            const messages = {
                ko: {
                    confirm: 'GitHub Actions 페이지로 이동합니다.\n\n1. "Run workflow" 버튼 클릭\n2. "Run workflow" 녹색 버튼 클릭\n3. 5-10분 후 대시보드 새로고침\n\n계속하시겠습니까?',
                    opened: 'GitHub Actions 페이지가 열렸습니다.\n\n"Run workflow" 버튼을 클릭하여 최신 데이터를 가져오세요.'
                },
                en: {
                    confirm: 'Opening GitHub Actions page.\n\n1. Click "Run workflow" button\n2. Click green "Run workflow" button\n3. Refresh dashboard after 5-10 minutes\n\nContinue?',
                    opened: 'GitHub Actions page opened.\n\nClick "Run workflow" button to fetch latest data.'
                },
                vi: {
                    confirm: 'Mở trang GitHub Actions.\n\n1. Nhấp nút "Run workflow"\n2. Nhấp nút xanh "Run workflow"\n3. Làm mới bảng điều khiển sau 5-10 phút\n\nTiếp tục?',
                    opened: 'Đã mở trang GitHub Actions.\n\nNhấp nút "Run workflow" để lấy dữ liệu mới nhất.'
                }
            };

            if (confirm(messages[lang].confirm)) {
                window.open('https://github.com/moonkaicuzui/qip-dashboard/actions/workflows/auto-update-enhanced.yml', '_blank');
                setTimeout(() => {
                    alert(messages[lang].opened);
                }, 500);
            }
        }
    </script>
