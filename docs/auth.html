<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 검색엔진 차단 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="bingbot" content="noindex, nofollow">
    <title>QIP Dashboard - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --vh: 1vh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .auth-container {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            max-width: 400px;
            width: 100%;
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .lock-icon {
            text-align: center;
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            letter-spacing: 2px;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: #999;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            font-size: 1.2rem;
            color: #999;
            pointer-events: none;
            transition: all 0.3s;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px 18px 16px 50px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input[type="email"]:focus ~ .input-icon,
        input[type="password"]:focus ~ .input-icon {
            color: #667eea;
        }

        input::placeholder {
            color: #bbb;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            margin-top: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            background: linear-gradient(135deg, #ccc 0%, #999 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-login.loading {
            position: relative;
            color: transparent;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            margin-left: -12px;
            margin-top: -12px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: linear-gradient(to right, #ff6b6b, #ee5a6f);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s, fadeIn 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .security-badge {
            margin-top: 30px;
            padding: 18px;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            border-radius: 14px;
            text-align: center;
        }

        .security-items {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .security-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .security-item-icon {
            font-size: 1.5rem;
        }

        .security-item-text {
            font-size: 0.7rem;
            color: #666;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #999;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 35px 25px;
            }

            .lock-icon {
                font-size: 3.5rem;
            }

            .brand-title {
                font-size: 1.3rem;
            }
        }

        @media (hover: none) {
            .btn-login:hover:not(:disabled) {
                transform: none;
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            }
        }

        .btn-login:active:not(:disabled) {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="lock-icon">🔐</div>

        <div class="brand">
            <div class="brand-title">QIP DASHBOARD</div>
            <div class="brand-subtitle">INCENTIVE MANAGEMENT SYSTEM</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                    <span class="input-icon">📧</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >
                    <span class="input-icon">🔑</span>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Login
            </button>

            <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="security-badge">
            <div class="security-items">
                <div class="security-item">
                    <div class="security-item-icon">🔥</div>
                    <div class="security-item-text">Firebase</div>
                </div>
                <div class="security-item">
                    <div class="security-item-icon">🔒</div>
                    <div class="security-item-text">Encrypted</div>
                </div>
                <div class="security-item">
                    <div class="security-item-icon">⏱️</div>
                    <div class="security-item-text">30 min session</div>
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by Firebase Authentication
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // ============================================
        // Firebase Authentication System
        // ============================================

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDzdmX9kBbeSIX1ROvvNcfu2CzFvnnz3oY",
            authDomain: "hwk-qip-incentive-dashboard.firebaseapp.com",
            projectId: "hwk-qip-incentive-dashboard",
            storageBucket: "hwk-qip-incentive-dashboard.firebasestorage.app",
            messagingSenderId: "435191241966",
            appId: "1:435191241966:web:fc8d3382d8189dc11d67ff"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Session Configuration (Issue #59: Security Enhancement)
        const SESSION_KEY = 'qip_firebase_session';
        const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutes (보안 강화: 60 → 30)

        // 브라우저 핑거프린트 생성 (세션 서명용)
        function generateFingerprint() {
            const data = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset()
            ].join('|');
            // Simple hash function
            let hash = 0;
            for (let i = 0; i < data.length; i++) {
                const char = data.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString(36);
        }

        // Check for existing valid session
        function checkExistingSession() {
            const session = sessionStorage.getItem(SESSION_KEY);
            if (session) {
                try {
                    const sessionData = JSON.parse(session);
                    const now = Date.now();

                    if (sessionData.authenticated &&
                        sessionData.uid &&
                        sessionData.email &&
                        (now - sessionData.loginTime) < SESSION_TIMEOUT) {
                        // Valid session exists, redirect to selector
                        window.location.href = 'selector.html';
                        return true;
                    } else {
                        // Invalid or expired session, clear it
                        sessionStorage.removeItem(SESSION_KEY);
                    }
                } catch (e) {
                    sessionStorage.removeItem(SESSION_KEY);
                }
            }
            return false;
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Get user-friendly error message
        function getErrorMessage(errorCode) {
            const messages = {
                'auth/user-not-found': 'Email not registered / 등록되지 않은 이메일',
                'auth/wrong-password': 'Incorrect password / 비밀번호 오류',
                'auth/invalid-email': 'Invalid email format / 잘못된 이메일 형식',
                'auth/too-many-requests': 'Too many attempts. Try again later / 잠시 후 다시 시도하세요',
                'auth/network-request-failed': 'Network error. Check connection / 네트워크 오류',
                'auth/invalid-credential': 'Invalid email or password / 이메일 또는 비밀번호 오류'
            };
            return messages[errorCode] || 'Login failed / 로그인 실패';
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validate inputs
            if (!email || !password) {
                showError('Please fill in all fields / 모든 필드를 입력하세요');
                return;
            }

            // Show loading state
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                // Sign in with Firebase
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Store session data with signature (Issue #59: Security Enhancement)
                const sessionData = {
                    authenticated: true,
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || email.split('@')[0],
                    loginTime: Date.now(),
                    signature: generateFingerprint() // 세션 서명 (조작 방지)
                };

                sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));

                // Redirect to selector page
                window.location.href = 'selector.html';

            } catch (error) {
                console.error('Login error:', error.code);
                showError(getErrorMessage(error.code));
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });

        // Firebase auth state listener (Issue #59: Updated with signature)
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // User is signed in, check if session exists
                const session = sessionStorage.getItem(SESSION_KEY);
                if (!session) {
                    // Session doesn't exist but Firebase says user is logged in
                    // This can happen after page reload, create session with signature
                    const sessionData = {
                        authenticated: true,
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        loginTime: Date.now(),
                        signature: generateFingerprint() // 세션 서명 추가
                    };
                    sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                }
            }
        });

        // Security: Prevent right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Security: Prevent keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });

        // Security: Developer tools warning
        const devtools = { warned: false };
        setInterval(() => {
            const threshold = 160;
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;

            if ((widthThreshold || heightThreshold) && !devtools.warned) {
                devtools.warned = true;
                console.clear();
                console.log('%c⛔ SECURITY WARNING', 'font-size: 40px; color: red; font-weight: bold;');
                console.log('%cUnauthorized access attempts are logged and monitored.', 'font-size: 14px; color: orange;');
            }
        }, 1000);

        // Initialize
        checkExistingSession();
        document.getElementById('email').focus();
    </script>
</body>
</html>
