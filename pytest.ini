[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (may access files)
    slow: Slow tests (>5s)
    calculation: Incentive calculation tests
    dashboard: Dashboard generation tests
    validation: Data validation tests
