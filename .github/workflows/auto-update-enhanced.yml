name: 🔄 Enhanced Auto Update Dashboard with Config Sync

on:
  schedule:
    # 30분마다 실행 (데이터 신선도 개선)
    - cron: '*/30 * * * *'

  # 수동 실행 가능
  workflow_dispatch:

  # main 브랜치 푸시시 실행
  push:
    branches: [ main ]
    paths:
      - 'integrated_dashboard_final.py'
      - 'scripts/enhanced_download_with_config.py'
      - '.github/workflows/auto-update-enhanced.yml'

# GitHub Actions에 write 권한 부여
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소 체크아웃
    - uses: actions/checkout@v3
      with:
        persist-credentials: true
        fetch-depth: 0

    # 2. Python 설정
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. 캐시 설정 (빠른 실행)
    - name: 📦 Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. 의존성 설치
    - name: 📚 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client beautifulsoup4

    # 5. 🆕 통합 다운로드 + Config 자동 업데이트
    - name: 📥 Download from Google Drive + Auto Update Config
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        echo "====================================="
        echo "🚀 통합 자동화 시스템 실행"
        echo "====================================="
        echo ""
        echo "1. Google Drive에서 최신 데이터 다운로드"
        echo "2. Config 파일 자동 업데이트 (실제 파일 경로 반영)"
        echo "3. Working days 자동 계산 및 업데이트"
        echo ""
        python scripts/enhanced_download_with_config.py

        # Config 파일 변경사항 확인
        echo ""
        echo "📋 Config 파일 변경사항:"
        git diff config_files/*.json || true

    # 6. Attendance 데이터 변환 (CRITICAL!) - 최신 config 기반 자동 변환
    - name: 🔄 Convert Attendance Data (Latest Config Based)
      run: |
        echo "====================================="
        echo "🔄 Attendance 데이터 자동 변환"
        echo "====================================="
        echo ""
        echo "📋 최신 config 파일에서 month/year 읽어서 변환합니다..."
        echo "   (Issue #32 Prevention: Working Days 불일치 자동 해결)"
        echo ""

        # 최신 config 파일 찾기
        LATEST_CONFIG=$(ls -t config_files/config_*.json | head -1)
        echo "📂 Using config: $LATEST_CONFIG"

        # JSON에서 month와 year 추출
        MONTH=$(python3 -c "import json; c=json.load(open('$LATEST_CONFIG')); print(c.get('month', 'december'))")
        YEAR=$(python3 -c "import json; c=json.load(open('$LATEST_CONFIG')); print(c.get('year', 2025))")

        echo "📅 Month: $MONTH"
        echo "📅 Year: $YEAR"
        echo ""

        # 해당 월의 attendance 데이터 변환
        python src/convert_attendance_data.py $MONTH $YEAR

        echo ""
        echo "✅ Attendance 데이터 변환 완료!"
        echo ""

    # 6.5 Attendance Schema Validation (Issue #31 & #32 Prevention)
    - name: 🔍 Validate Attendance Schema (Issue #31 & #32 Prevention)
      run: |
        echo "====================================="
        echo "🔍 Attendance Schema Validation"
        echo "====================================="
        echo ""
        echo "📋 Converted 출근 파일과 계산 엔진 간 스키마 일치 검증"
        echo "   - Issue #31: Approved Leave Days 미반영 버그 예방"
        echo "   - Issue #32: Working Days 불일치 자동 감지"
        echo ""

        # 스키마 검증 실행
        if [ -f "scripts/validate_attendance_schema.py" ]; then
          python scripts/validate_attendance_schema.py
          RESULT=$?
          if [ $RESULT -eq 0 ]; then
            echo ""
            echo "✅ Schema validation PASSED!"
          else
            echo ""
            echo "⚠️ Schema validation WARNING - check logs above"
            echo "   참조: CLAUDE.md Issue #31, Issue #32"
          fi
        else
          echo "⚠️ Schema validation script not found - skipping"
        fi

    # 7. 인센티브 자동 계산
    - name: 💰 Calculate Incentives
      run: |
        echo "Calculating incentives for all months..."
        python scripts/auto_calculate_incentives.py

    # 7.5 AQL Inspector Config 자동 업데이트 (NEW!)
    - name: 🔄 Auto Update AQL Inspector Config
      run: |
        echo "====================================="
        echo "🔄 AQL Inspector Config Auto-Update"
        echo "====================================="
        echo ""
        echo "📋 최신 인센티브 계산 결과를 config에 반영합니다..."
        echo ""

        # 최신 config 파일에서 월 정보 읽기
        LATEST_CONFIG=$(ls -t config_files/config_*.json | head -1)
        echo "📂 Using config: $LATEST_CONFIG"

        # JSON에서 month와 year 추출
        MONTH=$(python3 -c "import json; c=json.load(open('$LATEST_CONFIG')); print(c.get('month', 'november'))")
        YEAR=$(python3 -c "import json; c=json.load(open('$LATEST_CONFIG')); print(c.get('year', 2025))")

        echo "📅 Month: $MONTH"
        echo "📅 Year: $YEAR"
        echo ""

        # AQL Inspector config 자동 업데이트
        python scripts/auto_update_aql_config.py $MONTH $YEAR

        echo ""
        echo "✅ AQL Inspector config updated successfully!"
        echo ""

        # 변경사항 확인
        echo "📋 Config 변경사항:"
        git diff config_files/aql_inspector_incentive_config.json || echo "변경사항 없음"

    # 8. 자동 검증 실행
    - name: 🔍 Auto Validation
      run: |
        echo "Validating calculated incentives..."
        python scripts/auto_validation.py
      continue-on-error: false

    # 9. 대시보드 HTML 생성
    - name: 🎨 Generate Dashboard HTML
      run: |
        echo "Generating dashboard for all available months..."
        python scripts/generate_dashboard_for_pages.py

    # 9.5 SelfContained HTML 생성 (Offline 버전)
    - name: 📦 Generate SelfContained HTML (Offline Version)
      run: |
        echo "====================================="
        echo "📦 SelfContained HTML 자동 생성"
        echo "====================================="
        echo ""
        echo "Web Dashboard와 동기화된 Offline 버전을 생성합니다..."
        echo ""

        # 모든 대시보드에 대해 SelfContained 버전 생성 (Issue #40: 모든 월 포함)
        python scripts/generate_all_selfcontained.py --all

        echo ""
        echo "✅ SelfContained HTML 생성 완료!"
        echo ""

        # 생성된 파일 확인
        echo "📋 생성된 SelfContained 파일:"
        ls -la docs/*SelfContained*.html 2>/dev/null || echo "SelfContained 파일 없음"

    # 10. GitHub Pages 디렉토리 준비
    - name: 📂 Prepare GitHub Pages directory
      run: |
        # docs 폴더 생성 (GitHub Pages용)
        mkdir -p docs

        # HTML 파일 복사
        cp output_files/*.html docs/ 2>/dev/null || true

        # CSV/Excel 파일 복사 (다운로드용)
        cp output_files/*.csv docs/ 2>/dev/null || true
        cp output_files/*.xlsx docs/ 2>/dev/null || true

        # index.html 생성 (월 선택 페이지로 리다이렉트)
        echo "<!DOCTYPE html>
        <html lang=\"ko\">
        <head>
            <meta charset='UTF-8'>
            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
            <meta http-equiv='refresh' content='0; url=selector.html'>
            <title>QIP 인센티브 대시보드</title>
            <style>
                body {
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    margin: 0;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                }
                .loading {
                    text-align: center;
                }
                .spinner {
                    border: 4px solid rgba(255, 255, 255, 0.3);
                    border-radius: 50%;
                    border-top: 4px solid white;
                    width: 40px;
                    height: 40px;
                    animation: spin 1s linear infinite;
                    margin: 0 auto 20px;
                }
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            </style>
        </head>
        <body>
            <div class=\"loading\">
                <div class=\"spinner\"></div>
                <h2>QIP 인센티브 대시보드</h2>
                <p>월 선택 페이지로 이동 중...</p>
            </div>
        </body>
        </html>" > docs/index.html

        # 월 선택 페이지 생성
        python scripts/create_month_selector.py

    # 11. 변경사항 커밋 및 푸시
    - name: 📤 Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 변경사항 체크
        if [[ -n $(git status -s) ]]; then
          echo "📝 변경사항 발견, 커밋 준비 중..."

          # Add files we want to commit FIRST (before any stash)
          echo "📦 파일 추가 중..."
          git add config_files/*.json 2>/dev/null || true
          git add docs/*.html 2>/dev/null || true
          git add docs/*.csv 2>/dev/null || true
          git add docs/*.xlsx 2>/dev/null || true
          git add output_files/*.csv 2>/dev/null || true
          git add output_files/*.xlsx 2>/dev/null || true

          # Check if there are staged changes
          if [[ -n $(git diff --cached --name-only) ]]; then
            echo "✅ Staged files:"
            git diff --cached --name-only

            # Pull latest changes before committing
            echo "Pulling latest changes from remote..."
            git pull --rebase origin main || {
              echo "⚠️ Rebase failed, aborting and retrying with merge..."
              git rebase --abort || true
              git pull origin main --no-rebase || true
            }

            # Commit changes
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "🔄 Auto update dashboard + config sync from Google Drive $TIMESTAMP

            - Google Drive 데이터 자동 다운로드
            - Config 파일 자동 업데이트 (실제 파일 경로 반영)
            - Working days 자동 계산 및 업데이트
            - 인센티브 계산 및 대시보드 생성" || {
              echo "⚠️ Commit failed"
              exit 0
            }

            # Push changes
            git push || {
              echo "❌ Push failed, manual intervention required"
              exit 1
            }

            echo "✅ Dashboard and config updated successfully!"
          else
            echo "ℹ️ No files to commit after staging"
          fi
        else
          echo "ℹ️ No changes detected"
        fi

    # 12. 성공 알림
    - name: 🎉 Success Notification
      run: |
        echo "=================================="
        echo "✅ 자동화 완료!"
        echo "=================================="
        echo ""
        echo "📊 업데이트된 항목:"
        echo "  - Google Drive 데이터 동기화"
        echo "  - Config 파일 자동 업데이트"
        echo "  - Working days 계산 및 반영"
        echo "  - 인센티브 계산"
        echo "  - 대시보드 생성"
        echo ""
        echo "🌐 대시보드 URL:"
        echo "https://moonkaicuzui.github.io/qip-dashboard/"
        echo ""
        echo "📝 Config 파일들:"
        ls -la config_files/config_*.json | tail -5
        echo ""
        echo "⏰ 다음 실행: 30분 후"